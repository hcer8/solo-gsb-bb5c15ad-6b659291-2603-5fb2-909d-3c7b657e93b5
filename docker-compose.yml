services:
  clock-calibration:
    build: .
    image: offline-interview-clock-calibration:latest
    container_name: clock-calibration
    ports:
      # 宿主机端口:容器端口；宿主机端口可用环境变量 HOST_PORT 覆盖
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 预留的运行期配置（容器内监听地址/端口需与 Dockerfile CMD 一致）
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
